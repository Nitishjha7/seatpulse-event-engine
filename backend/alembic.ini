[alembic]
script_location = alembic
prepend_sys_path = .

# Migration file ka naam: 2026_08_10_1430-abc123_add_seats.py
# Default sirf hash hota hai — date se history padhna aasan ho jata hai.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# NOTE: sqlalchemy.url yahan jaan-boojh ke khali hai.
# URL alembic/env.py me settings se aata hai, taki password is file me
# (jo Git me jati hai) kabhi na likha jaye.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
