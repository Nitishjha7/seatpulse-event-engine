name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# don't waste runner time on stale pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # runs against the same docker-compose stack used locally instead of
  # GitHub's `services:` containers, so this actually exercises the real
  # setup instead of a different one that happens to also have postgres/redis
  test:
    name: Tests (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Create env file
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env

      - name: Docker layer cache
        uses: docker/setup-buildx-action@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Backend ready ($i sec)"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start within 60s"
          docker compose logs backend
          exit 1

      - name: Migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Seed data
        run: docker compose exec -T backend python seed.py

      - name: Pytest
        run: docker compose exec -T backend python -m pytest tests/ -v

      - name: Integrity check
        run: docker compose exec -T backend python verify_integrity.py

      - name: Logs (on failure only)
        if: failure()
        run: docker compose logs --tail 200

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # separate job because the prod target strips out dev tooling and can't
  # run pytest — want to catch a broken prod build here, not on deploy
  build-prod:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - name: Env file
        run: cp .env.example .env

      - name: Build prod images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            build backend worker frontend

      - name: Ensure no dev tools in prod image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            run --rm --no-deps --entrypoint sh backend -c \
            'if python -c "import pytest" 2>/dev/null; then
               echo "FAIL: pytest found in prod image"; exit 1
             fi
             echo "OK: no dev tools found"'

      - name: Ensure prod image does not run as root
        run: |
          USER_ID=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            run --rm --no-deps --entrypoint id backend -u 2>/dev/null | tail -1)
          echo "uid = $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "FAIL: container is running as root"
            exit 1
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
