name: CI

# Run on both push and PR. PRs prevent broken code from reaching main — finding issues after merge is too late.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same branch to save runner minutes and avoid stale results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Full test suite — run the entire stack and execute 66 tests.
  #
  # ⚠️ `services:` block intentionally NOT used.
  #
  # GitHub services only provide DB/Redis containers, requiring the app to run separately on the runner. This means CI would test an environment that doesn't match production. We run the same docker-compose used locally to ensure CI catches configuration errors.
  # ---------------------------------------------------------------------
  test:
    name: Tests (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Create env file
        # Compose requires a root .env file. The example file is sufficient as it contains only development defaults, not actual secrets.
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env

      - name: Docker layer cache
        uses: docker/setup-buildx-action@v3

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for backend
        # Polling is better than a blind `sleep 30`: proceed immediately when ready, or fail with logs if it times out.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Backend ready ($i sec)"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start within 60s"
          docker compose logs backend
          exit 1

      - name: Migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Seed data
        # Tests require 500 users and an event. Without seeding, fixtures are skipped, which can lead to false-positive green test results.
        run: docker compose exec -T backend python seed.py

      - name: Pytest
        run: docker compose exec -T backend python -m pytest tests/ -v

      - name: Integrity check
        # Post-test DB invariants check — ensure no overselling occurred.
        run: docker compose exec -T backend python verify_integrity.py

      - name: Logs (on failure only)
        if: failure()
        run: docker compose logs --tail 200

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------
  # Verify production image builds.
  #
  # This is a separate job because production images lack dev tools and cannot run tests. Detecting build failures during deployment is too late.
  # ---------------------------------------------------------------------
  build-prod:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Env file
        run: cp .env.example .env

      - name: Build prod images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            build backend worker frontend

      - name: Ensure no dev tools in prod image
        # This is a critical check: including pytest/locust in production images increases image size and expands the attack surface.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            run --rm --no-deps --entrypoint sh backend -c \
            'if python -c "import pytest" 2>/dev/null; then
               echo "FAIL: pytest found in prod image"; exit 1
             fi
             echo "OK: no dev tools found"'

      - name: Ensure prod image does not run as root
        run: |
          # 2>/dev/null suppresses compose stderr messages to prevent them from mixing with the UID output. tail -1 captures the final line.
          USER_ID=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            run --rm --no-deps --entrypoint id backend -u 2>/dev/null | tail -1)
          echo "uid = $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "FAIL: container is running as root"
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Ensure frontend build is not broken.
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci strictly follows the lockfile. `npm install` can silently update dependency versions in CI, reducing the reliability of test results.
      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
