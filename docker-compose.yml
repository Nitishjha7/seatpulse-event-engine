services:
  db:
    image: postgres:16-alpine
    container_name: seatpulse_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seatpulse_redis
    ports:
      - "${REDIS_PORT}:6379"
    # no volume on purpose — seat locks are 5-minute TTLs anyway, losing
    # them on restart just means those seats show available again, which
    # is fine. booking/payment data always lives in postgres, not here.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev   # prod build uses docker-compose.prod.yml (target: prod)
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ticket_data:/app/tickets
    environment:
      # "db"/"redis" are the compose service names — that's the hostname
      # inside the container network, localhost won't resolve to them here
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      BENCHMARK_MODE: ${BENCHMARK_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: dev
    container_name: seatpulse_worker
    # same image as backend, just a different command, so it shares the
    # exact same models/config instead of drifting out of sync
    command: arq worker.WorkerSettings
    volumes:
      - ./backend:/app
      - ticket_data:/app/tickets
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: react_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # off by default, run with: docker compose --profile loadtest run --rm
  # locust -f locustfile.py FlashSaleUser --headless -u 500 -r 100 -t 30s
  locust:
    build: ./loadtest
    container_name: seatpulse_locust
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/loadtest
    ports:
      - "8089:8089"
    environment:
      LOCUST_HOST: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  ticket_data:
