services:
  db:
    image: postgres:16-alpine
    container_name: seatpulse_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expose to host for pgAdmin/DBeaver connectivity.
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Named volume — persists data even if the container is deleted.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # There is a difference between Postgres being "started" and "accepting connections".
      # The backend will only start once this check passes.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seatpulse_redis
    ports:
      - "${REDIS_PORT}:6379"
    # No volume — intentional.
    # Redis holds only temporary seat locks (5 min TTL). On restart, if they
    # are lost, it is fine: seats will become available in the DB.
    # Financial/booking data always resides in Postgres.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      # dev stage — includes --reload and the test tooling.
      # For production: docker-compose.prod.yml (target: prod)
      target: dev
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Worker generates tickets; API serves them from here.
      - ticket_data:/app/tickets
    environment:
      # "db" and "redis" are compose service names. These are the hostnames
      # in the container network. localhost will NOT work here — it would point
      # to the backend container itself.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Phase 15 benchmark settings. Default off — set in .env
      # BENCHMARK_MODE=true enables the pessimistic path.
      BENCHMARK_MODE: ${BENCHMARK_MODE:-false}
    depends_on:
      db:
        # Not just "started" — wait until the DB is ready.
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      # dev stage — includes --reload and the test tooling.
      # For production: docker-compose.prod.yml (target: prod)
      target: dev
    container_name: seatpulse_worker
    # ⭐ Same image as backend, different command. This avoids code duplication
    # and ensures the worker has the same models/config as the API.
    command: arq worker.WorkerSettings
    volumes:
      - ./backend:/app
      # Tickets in a shared volume — worker writes, API reads and serves.
      # Without this, the API cannot access the files.
      - ticket_data:/app/tickets
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # dev stage — includes --reload and the test tooling.
      # For production: docker-compose.prod.yml (target: prod)
      target: dev
    container_name: react_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Load testing. Does not start by default — due to profile.
  # To run:
  #   docker compose --profile loadtest run --rm locust \
  #       -f locustfile.py FlashSaleUser --headless -u 500 -r 100 -t 30s
  locust:
    build: ./loadtest
    container_name: seatpulse_locust
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/loadtest
    ports:
      - "8089:8089"
    environment:
      # Via container network — localhost will not reach the backend container here.
      LOCUST_HOST: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  ticket_data:
