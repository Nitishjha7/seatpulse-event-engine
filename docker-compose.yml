services:
  db:
    image: postgres:16-alpine
    container_name: seatpulse_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host pe expose kar rahe hain taki pgAdmin/DBeaver se connect kar sako.
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Named volume — container delete hone par bhi data bacha rehta hai.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Postgres "started" hone aur "connections accept karne" me farak hai.
      # Ye check pass hone par hi backend start hoga.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seatpulse_redis
    ports:
      - "${REDIS_PORT}:6379"
    # Koi volume nahi — jaan-boojh ke.
    # Redis me sirf temporary seat locks hain (5 min TTL wale). Restart pe wo
    # chale bhi jayein to koi nuksan nahi: seats DB me available ho jaayengi.
    # Paisa/booking ka data hamesha Postgres me hi rehta hai.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Worker jo tickets banata hai, API unhe yahin se serve karti hai
      - ticket_data:/app/tickets
    environment:
      # "db" aur "redis" = compose services ke naam. Container network me yahi
      # hostnames hain. localhost yahan kaam NAHI karega — wo backend container
      # ko khud ko point karega.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Phase 15 benchmark ke knobs. Default off — .env me
      # BENCHMARK_MODE=true karke hi pessimistic path chalta hai.
      BENCHMARK_MODE: ${BENCHMARK_MODE:-false}
    depends_on:
      db:
        # Sirf "started" nahi — DB ready hone tak wait karo.
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: seatpulse_worker
    # ⭐ Same image as backend, alag command. Isse code duplicate nahi hota
    # aur worker ko wahi models/config milte hain jo API ke paas hain.
    command: arq worker.WorkerSettings
    volumes:
      - ./backend:/app
      # Tickets ek shared volume me — worker likhta hai, API padh ke serve
      # karta hai. Bina iske API ko file milti hi nahi.
      - ticket_data:/app/tickets
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Load testing. Normally start NAHI hota — profile ki wajah se.
  # Chalane ke liye:
  #   docker compose --profile loadtest run --rm locust \
  #       -f locustfile.py FlashSaleUser --headless -u 500 -r 100 -t 30s
  locust:
    build: ./loadtest
    container_name: seatpulse_locust
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/loadtest
    ports:
      - "8089:8089"
    environment:
      # Container network se — localhost yahan backend container ko nahi milega
      LOCUST_HOST: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  ticket_data:
