server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ⭐ SPA fallback — without this, refreshing at /events/3 results in a 404.
    #
    # Reason: Routing is handled by React Router, not Nginx. Nginx
    # looks for a file named /events/3, which does not exist. Therefore, for
    # every unknown path, serve index.html and let the router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets (index-DTJXVmPu.js) — if content changes, the name changes,
    # so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # NEVER cache index.html.
    #
    # This file points to the new asset names. If cached,
    # the user will continue requesting old assets after a deployment — and those
    # assets no longer exist. Result: blank page.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
