server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ⭐ SPA fallback — ye line na ho to /events/3 par refresh karne se 404
    # aata hai.
    #
    # Wajah: routing React Router ke paas hai, nginx ke paas nahi. Nginx
    # /events/3 naam ki file dhoondhta hai, milti nahi. Isliye har unknown
    # path par index.html bhej do aur router ko decide karne do.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets (index-DTJXVmPu.js) — content badle to naam badal jata
    # hai, isliye inhe hamesha ke liye cache kar sakte hain.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html KABHI cache nahi.
    #
    # Ye wahi file hai jo naye asset names batati hai. Isko cache kar diya
    # to user deploy ke baad bhi purane assets maangta rahega — aur wo
    # assets ab exist hi nahi karte. Nateeja: blank page.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
