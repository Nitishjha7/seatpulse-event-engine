server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router handles routing client-side, so nginx needs to fall back
    # to index.html for any path it doesn't have a file for, or refreshing
    # on e.g. /events/3 just 404s
    location / {
        try_files $uri $uri/ /index.html;
    }

    # filenames are content-hashed, so these are safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # but never cache this one — it's what points at the current hashed
    # asset names, and a stale cached copy means a blank page after deploy
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
