# Production override — applied on top of dev compose:
#
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Why an override file instead of a separate one: db/redis config, network,
# volumes, and healthchecks must remain consistent. Separate files would
# drift over time, leading to "it behaves differently in prod" issues.
# This file only contains what actually changes.

services:
  backend:
    build:
      target: prod
    # ⭐ This phase is for this line — scaling from 1 worker to 4.
    #
    # Each worker is a separate process with its own memory. This means
    # nothing is shared in-memory — not even WebSocket connections.
    # That is why broadcasting in Phase 5 used Redis pub/sub, not a
    # Python dict. That design decision is critical here.
    environment:
      WORKERS: ${WORKERS:-4}
      # Each worker has its own connection pool. 4 workers x 40 = 160
      # connections — while Postgres default max_connections is 100.
      #
      # Therefore, the per-worker pool MUST be reduced. This is a common
      # mistake only visible after running in multi-worker mode:
      #   4 x (5 + 5) = 40 connections, well within the 100 limit.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      # Admission control is also per-worker, so this must be reduced too.
      # The invariant remains: MAX_CONCURRENT < pool + overflow.
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-8}
      # Never use benchmark knobs in production.
      BENCHMARK_MODE: "false"
    # NO source bind-mount. Code is baked into the prod image — mounting
    # would cause the deployed image and running code to diverge.
    volumes:
      - ticket_data:/app/tickets
    restart: unless-stopped

  worker:
    build:
      target: prod
    # ARQ worker doesn't need web workers — it handles its own
    # concurrency. However, its pool must also be small, as it
    # shares the same Postgres instance.
    environment:
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    volumes:
      - ticket_data:/app/tickets
    restart: unless-stopped

  frontend:
    build:
      target: prod
      args:
        # ⚠️ Baked at build time. You must provide the actual domain
        # during deployment — it cannot be changed once the container
        # starts.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    # nginx listens on 80, Vite used to listen on 5173
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes: []
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped
