# prod override on top of the dev compose file:
#
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# kept as an override instead of a fully separate file so db/redis/network
# config can't drift between dev and prod — only what actually needs to
# change for prod lives here.

services:
  backend:
    build:
      target: prod
    environment:
      WORKERS: ${WORKERS:-4}
      # each of the 4 workers gets its own connection pool, so the
      # per-worker size has to come down or we blow past postgres's
      # default max_connections (100): 4 x (5 + 5) = 40, comfortably under
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      # same reasoning — admission control is per-worker too, so it needs
      # scaling down along with the pool. keep MAX_CONCURRENT < pool + overflow
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-8}
      BENCHMARK_MODE: "false"
    # no source bind-mount — code is baked into the image here, mounting
    # the host dir would make the running container diverge from the image
    volumes:
      - ticket_data:/app/tickets
    restart: unless-stopped

  worker:
    build:
      target: prod
    environment:
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    volumes:
      - ticket_data:/app/tickets
    restart: unless-stopped

  frontend:
    build:
      target: prod
      args:
        # baked in at build time — set the real domain before building,
        # can't change it after the container is running
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"   # nginx on 80 here, vite dev server used 5173
    volumes: []
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped
